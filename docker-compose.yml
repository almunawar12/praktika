x-app: &app
  image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}:${IMAGE_TAG:-latest}
  # `latest`/`staging` are moving tags: a plain `compose up -d` reuses the
  # locally cached image and silently redeploys stale code. Always re-pull.
  pull_policy: always
  # Dokploy writes this file from the app's Environment tab, so every
  # APP_*/DB_*/SESSION_* var lands here. Commenting a var out there removes it
  # entirely, which is what Laravel's env() defaults expect.
  env_file:
    - .env
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - storage:/var/www/html/storage/app

services:
  web:
    <<: *app
    expose:
      - "8081"
    environment:
      NGINX_HTTP_PORT: "8081"
      HEALTHCHECK_PATH: /up
      AUTORUN_ENABLED: "true"
      # Only the web container migrates — otherwise all three race on boot.
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      PHP_OPCACHE_ENABLE: "1"
      PHP_UPLOAD_MAX_FILE_SIZE: 10M
      PHP_POST_MAX_SIZE: 12M
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8081/up']
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # routes/console.php schedules queued jobs (mark-absent-students,
  # complete-expired-placements). Without these two services they never run.
  queue:
    <<: *app
    command:
      - php
      - /var/www/html/artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
    depends_on:
      web:
        condition: service_healthy
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  scheduler:
    <<: *app
    command:
      - php
      - /var/www/html/artisan
      - schedule:work
    depends_on:
      web:
        condition: service_healthy
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  storage:
